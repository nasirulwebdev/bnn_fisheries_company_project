{% extends 'base.html' %}

{% block title %}যোগাযোগ | FISHERIES{% endblock %}

{% block content %}
<h1 class="mb-4 text-center">যোগাযোগ করুন</h1>

<div class="row justify-content-center">
    <div class="col-md-8">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="name" class="form-label">নাম</label>
                <input type="text" name="name" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">ইমেইল</label>
                <input type="email" name="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label">বিষয়</label>
                <input type="text" name="subject" id="subject" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">বার্তা</label>
                <textarea name="message" id="message" rows="5" class="form-control" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">পাঠান</button>
        </form>
    </div>
</div>
{% endblock %}
