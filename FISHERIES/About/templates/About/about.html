{% extends 'base.html' %}

{% block title %}আমাদের সম্পর্কে | FISHERIES{% endblock %}

{% block content %}
<div class="row align-items-center">
    <div class="col-md-6">
        <h1 class="mb-3">
            {{ about.title }}
        </h1>
        <p class="text-muted">
            {{ about.short_description }}
        </p>
        <p>
            {{ about.description|linebreaks }}
        </p>
    </div>

    <div class="col-md-6">
        {% if about.image %}
            <img src="{{ about.image.url }}"
                 alt="{{ about.title }}"
                 class="img-fluid rounded shadow">
        {% else %}
            <div class="alert alert-info">
                কোন ছবি আপলোড করা হয়নি
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
